<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NRP | NevRyder Productions</title>
  <meta name="description" content="NevRyder Productions – Drum & Bass & UK Garage DJ / Producer">  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Arial, sans-serif;
      background: #000;
      color: #fff;
      line-height: 1.6;
      overflow-x: hidden;
    }

    /* ===== BACKGROUND ZOOM ONLY ===== */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: url('nrp-background.png') center / cover no-repeat;
      transform: scale(var(--bg-scale, 1));
      transform-origin: center;
      z-index: -1;
      will-change: transform;
    }

    /* ===== TOP PRODUCTION BANNER ===== */
    .top-banner {
      width: 100%;
      text-align: center;
      margin-top: -30px; /* moved productions image up */
    }

    .top-banner img {
      width: 100%;
      display: block;
      -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 65%, rgba(0,0,0,0));
      mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 65%, rgba(0,0,0,0));
    }

    /* ===== ABOUT IMAGE ===== */
    .about-wrap {
      display: flex;
      justify-content: center;
      margin-top: 40px; /* moved about image down several notches */
    }

    .about-image {
      max-width: 900px;
      width: 100%;
      border-radius: 20px;
      border: 4px solid #ff8c00;
      box-shadow:
        0 30px 80px rgba(0,0,0,0.9),
        0 0 35px rgba(255,140,0,0.85);
    }

    /* ===== LINKS GLASS BOX ===== */
    .links {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 120px 0 120px;
    }

    .nrp-music {
      width: 260px;
      margin-bottom: 18px; /* slightly above the glass box */
      filter: drop-shadow(0 0 25px rgba(255,140,0,0.8));
    }

    .link-glass {
      display: flex;
      flex-wrap: wrap;
      gap: 30px;
      padding: 70px 36px;
      min-height: 400px;

      /* Glassy translucent look */
      background: linear-gradient(145deg,
        rgba(255,255,255,0.08),
        rgba(0,0,0,0.35)
      );
      backdrop-filter: blur(22px) saturate(140%);
      -webkit-backdrop-filter: blur(22px) saturate(140%);

      border-radius: 26px;
      border: 1px solid rgba(255,255,255,0.25);

      /* Strong 3D depth */
      box-shadow:
        0 40px 120px rgba(0,0,0,0.9),
        inset 0 1px 0 rgba(255,255,255,0.35),
        inset 0 -30px 50px rgba(0,0,0,0.7);

      justify-content: center;
      align-items: flex-start;

      transform: perspective(1200px) translateZ(20px);
    }

    .platform-logo {
      width: 90px;
      height: auto;
      transition: transform 0.2s ease, filter 0.2s ease;
      cursor: pointer;
    }

    .spotify {
      filter: drop-shadow(0 0 18px rgba(30,215,96,0.9));
    }

    .youtube {
      filter: drop-shadow(0 0 18px rgba(255,0,0,0.9));
    }

    .platform-logo:hover {
      transform: scale(1.08);
    }

    footer {
      text-align: center;
      padding: 30px 20px;
      font-size: 0.9rem;
      opacity: 0.6;
    }
  </style></head><body>  <!-- TOP IMAGE -->  <div class="top-banner">
    <img src="nrp-productions.png" alt="NevRyder Productions">
  </div>  <!-- ABOUT IMAGE -->  <div class="about-wrap">
    <img src="about-image.png" alt="About NRP" class="about-image">
  </div>  <!-- MUSIC LINKS --><div class="links">
<img src="nrpmusic.png" alt="NRP Music" class="nrp-music">
<div class="link-glass">
  <a href="https://open.spotify.com/album/7DdkhKBb2kVhlKcERr82v2?si=kyrZbAhiQIWZEYl0Jh7RXg" target="_blank" rel="noopener">
    <img src="spotify.png" alt="Spotify" class="platform-logo spotify">
  </a>
  <a href="https://share.google/S0BS6JJV8CWV0O0m2" target="_blank" rel="noopener">
    <img src="youtube.png" alt="YouTube" class="platform-logo youtube">
  </a>
</div>

  </div>  <footer>
    © <span id="year"></span> NevRyder Productions
  </footer>  <script>
    const root = document.documentElement;
    window.addEventListener('scroll', () => {
      let zoom = 1 + window.scrollY * 0.00035;
      zoom = Math.min(Math.max(zoom, 1), 1.35);
      root.style.setProperty('--bg-scale', zoom);
    });

    document.getElementById('year').textContent = new Date().getFullYear();
  </script></body>
</html>
